{% macro age(t, max_days) -%}
{% if t.age_days is none %}<span class="muted">unknown age</span>
{% elif t.age_days > max_days %}<span class="badge stale">{{ t.age_days }} day{{ "" if t.age_days == 1 else "s" }} old</span>
{% else %}<span class="muted">{{ t.age_days }} day{{ "" if t.age_days == 1 else "s" }} old</span>{% endif %}
{%- endmacro %}
