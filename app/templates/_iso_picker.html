{% set field_name = "iso_" ~ backend.id %}
{% set where = "ISO files on " ~ backend.name ~ (" (its cluster's datastores)" if backend.type == "vsphere" else " (its ISO storage)") %}
{% if isos %}
<label class="field"><span class="label">Installer ISO on {{ backend.name }}</span>
  <select name="{{ field_name }}">
    <option value="" {% if not value %}selected{% endif %}>Choose an ISO…</option>
    {% if value and value not in isos %}<option value="{{ value }}" selected>{{ value }} (not found)</option>{% endif %}
    {% for path in isos %}<option value="{{ path }}" {% if path == value %}selected{% endif %}>{{ path }}</option>{% endfor %}
  </select>
  <span class="hint">{{ hint ~ ". " if hint }}{{ where }}.</span>
</label>
{% else %}
<label class="field"><span class="label">Installer ISO on {{ backend.name }}</span>
  <input type="text" name="{{ field_name }}" value="{{ value }}" class="mono" autocomplete="off"
         placeholder="{{ '[datastore1] ISO/installer.iso' if backend.type == 'vsphere' else 'local:iso/installer.iso' }}">
  {% if error_text %}<span class="hint lock">Couldn't list ISO files: {{ error_text }}</span>
  {% elif isos is not none %}<span class="hint">None found: {{ where }}. {{ hint }}</span>
  {% else %}<span class="hint">{{ hint }}</span>{% endif %}
</label>
{% endif %}
