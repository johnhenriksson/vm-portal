{% extends "base.html" %}
{% block title %}Account · VM Portal{% endblock %}
{% block content %}
<div class="page-head"><div>
  <h1>Account</h1>
  <p class="sub">Signed in as <strong>{{ current_user.username }}</strong> ({{ current_user.role }})</p>
</div></div>

<div class="card" style="max-width:32rem">
  <div class="card-head">Change password</div>
  <div class="card-body">
    <form method="post" action="/account/password">
      {{ csrf_field(request) }}
      <input type="text" name="username" value="{{ current_user.username }}" autocomplete="username" hidden>
      <label class="field"><span class="label">Current password</span>
        <input type="password" name="current" required autocomplete="current-password" maxlength="256"></label>
      <label class="field"><span class="label">New password</span>
        <input type="password" name="password" required minlength="12" maxlength="256" autocomplete="new-password">
        <span class="hint">At least 12 characters. Changing it logs out your other sessions.</span></label>
      <label class="field"><span class="label">Confirm new password</span>
        <input type="password" name="confirm" required minlength="12" maxlength="256" autocomplete="new-password"></label>
      <button type="submit">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
