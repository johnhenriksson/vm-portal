# Publish site/ (the project's landing page) to GitHub Pages, with screenshots taken
# from this commit's portal, so the page never shows an older version of the UI.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Runs the portal, pip packages and a container: read-only, no Pages or OIDC permissions.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Take the screenshots
        # The real portal with invented data and a fake vCenter (site/screenshots/demo_server.py);
        # headless Chromium from the pinned Playwright image. A failure stops the deploy rather
        # than publishing stale or missing images.
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          site/screenshots/run.sh
          for f in dashboard create-vm vm-detail images build-log editor; do test -s "site/img/$f.webp"; done
          test -s site/img/og.png
      - name: Fill in the repository's links
        # The page links to github.com/OWNER/vm-portal and OWNER.github.io/vm-portal;
        # point them at wherever this repository actually is.
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p _site
          cp -r site/index.html site/site.css site/favicon.svg site/img _site/
          owner_lc=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          sed -i -e "s#github.com/OWNER/vm-portal#github.com/${REPO}#g" \
                 -e "s#OWNER.github.io/vm-portal/#${owner_lc}.github.io/${NAME}/#g" _site/index.html
          ! grep -n "OWNER" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Only publishes what the build job uploaded.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the site
      id-token: write   # prove to Pages that this workflow is publishing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
