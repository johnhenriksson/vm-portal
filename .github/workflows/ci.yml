name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (verifies tool signatures)
        run: docker build -t vm-portal:ci .
      - name: Validate the built-in image definitions with the bundled Packer
        run: |
          docker run --rm -e DATA_DIR=/tmp/d -e PYTHONPATH=/app --entrypoint python vm-portal:ci -c "
          from app import editor, images
          for img in images.catalog():
              assert img.usable, (img.id, img.error)
              ok, out = editor.packer_check(img)  # syntax, then with the portal's variables
              print(img.id, out)
              assert ok
          "
